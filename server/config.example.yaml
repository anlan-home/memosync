# memosync 服务端配置示例
# 复制为 config.yaml 放在二进制同目录，或用 -config 指定路径。
# 全部项都有默认值；也可用环境变量 MEMOSYNC_LISTEN / MEMOSYNC_DATA_DIR / MEMOSYNC_BASE_URL 覆盖。

# HTTP 监听地址
listen: ":5231"

# 数据目录：SQLite 库、附件、备份都在这里。
# fnOS 安装时由安装脚本指向包数据目录；卸载/升级软件包请勿删除该目录。
data_dir: "./data"

# 对外访问地址（可选）。用于配对码携带服务器地址。
# 家里有公网域名或用 Tailscale 时填对应地址，例如：
#   base_url: "http://100.64.0.2:5231"
# 留空则按请求的 Host 自动推断。
base_url: ""

# 日志文件（可选），留空输出到标准输出
log_file: ""
